<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/e-book.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Tagesschrift&display=swap" rel="stylesheet">
    <title>Bibliotek Reader</title>
</head>
<body>
    <header>
        <h1>PDF Reader</h1>
        <button class="night-mode">Night Mode</button>
    </header>
    <div class="container">
        <div class="menu">
        <button class="biblioteca">Biblioteca</button>
        <button class="upload">Upload PDF</button>
        <button class="marcador">Marcador de Texto</button>
        </div>

        <div class="viewer">
        <div class="pdf-viewer">
            <p>PDF Viewer Placeholder</p>
        </div>

        <div class="navigation">
        <button class="previous">Previous</button>
        <button class="next">Next</button>
        </div>
        </div>

        <div class="menu2">
        <button class="sumario">Sumário</button>
        <button class="busca">Buscar no PDF</button>
        <button class="fonte">Alterar Fonte</button>
        </div>
    </div>
</body>
</html>
